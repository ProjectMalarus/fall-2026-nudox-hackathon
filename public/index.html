<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.I.: Artificial Investigator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg: #0d1117;
        --panel: #161b24;
        --panel-2: #1d2430;
        --border: #2c3545;
        --text: #e6e9ef;
        --muted: #98a2b3;
        --accent: #6ee7b7;
        --danger: #f87171;
        --player: #2563eb;
        --suspect: #273244;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at top, #151d2a 0%, var(--bg) 55%);
        color: var(--text);
      }

      .game {
        max-width: 1000px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 5vw, 3rem);
        letter-spacing: 0.02em;
      }

      .header h1 span {
        color: var(--accent);
      }

      .tagline {
        max-width: 560px;
        margin: 0 auto 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .badge {
        display: inline-block;
        padding: 0.45rem 1rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel-2);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .badge.empty {
        color: var(--danger);
        border-color: rgba(248, 113, 113, 0.4);
      }

      .case-file {
        margin-bottom: 1.5rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
      }

      .case-file h2 {
        margin: 0 0 0.6rem;
        font-size: 1.1rem;
      }

      .case-file h3 {
        margin: 0 0 0.4rem;
        font-size: 1rem;
      }

      .case-file p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .suspect-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .suspect-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        cursor: pointer;
        transition: border-color 0.15s, transform 0.15s, background 0.15s;
      }

      .suspect-card:hover {
        border-color: #475569;
        transform: translateY(-2px);
      }

      .suspect-card.selected {
        border-color: var(--accent);
        background: #17211f;
        box-shadow: 0 0 0 1px var(--accent);
      }

      .suspect-card h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .bio {
        flex: 1;
        margin: 0;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.5;
      }

      .card-actions {
        display: flex;
        justify-content: flex-end;
      }

      .accuse {
        padding: 0.45rem 0.9rem;
        border: 1px solid rgba(248, 113, 113, 0.45);
        border-radius: 8px;
        background: transparent;
        color: var(--danger);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      .accuse:hover:not(:disabled) {
        background: rgba(248, 113, 113, 0.12);
      }

      .accuse:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .suspect-card.accused {
        border-color: var(--danger);
      }

      .suspect-card.is-ai {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent), 0 0 24px rgba(110, 231, 183, 0.12);
      }

      .reveal-badge {
        position: absolute;
        top: -10px;
        right: 12px;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        background: var(--accent);
        color: #04201a;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .interrogation {
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
      }

      .interrogation h2 {
        margin: 0 0 1rem;
        font-size: 1.1rem;
      }

      .chat-log {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        min-height: 240px;
        max-height: 360px;
        overflow-y: auto;
        padding: 0.5rem 0.25rem 1rem;
      }

      .placeholder {
        margin: 3rem 0;
        color: var(--muted);
        font-style: italic;
        text-align: center;
      }

      .bubble {
        max-width: 80%;
        padding: 0.65rem 0.9rem;
        border-radius: 12px;
        font-size: 0.95rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .bubble.player {
        align-self: flex-end;
        background: var(--player);
        border-bottom-right-radius: 4px;
      }

      .bubble.suspect {
        align-self: flex-start;
        background: var(--suspect);
        border-bottom-left-radius: 4px;
      }

      .bubble.system {
        align-self: center;
        background: transparent;
        color: var(--muted);
        font-size: 0.85rem;
        font-style: italic;
        text-align: center;
      }

      .chat-form {
        display: flex;
        gap: 0.6rem;
      }

      .chat-form input {
        flex: 1;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0f141c;
        color: var(--text);
        font: inherit;
      }

      .chat-form input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .chat-form input:disabled {
        opacity: 0.5;
      }

      .chat-form button {
        padding: 0.8rem 1.3rem;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #04201a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .chat-form button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .result {
        margin-top: 1.5rem;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
        text-align: center;
      }

      .result h2 {
        margin: 0 0 0.35rem;
        font-size: 1.4rem;
      }

      .result p {
        margin: 0;
        color: var(--muted);
      }

      .result.win {
        border-color: rgba(110, 231, 183, 0.5);
        background: rgba(16, 185, 129, 0.08);
      }

      .result.win h2 {
        color: var(--accent);
      }

      .result.lose {
        border-color: rgba(248, 113, 113, 0.5);
        background: rgba(248, 113, 113, 0.07);
      }

      .result.lose h2 {
        color: var(--danger);
      }

      .restart {
        display: block;
        margin: 1.25rem auto 0;
        padding: 0.75rem 1.4rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .restart:hover {
        border-color: var(--accent);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 560px) {
        .bubble {
          max-width: 92%;
        }

        .chat-form {
          flex-wrap: wrap;
        }

        .chat-form button {
          flex: 1 0 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <header class="header">
        <h1>A.I.: <span>Artificial Investigator</span></h1>
        <p class="tagline">
          Three suspects. One is secretly an AI. Ask up to six questions, then make your accusation.
        </p>
        <div class="hud">
          <span id="questions-left" class="badge">6 questions left</span>
        </div>
      </header>

      <section id="case-file" class="case-file" aria-label="Case File">
        <h2>Case File</h2>
        <h3 id="case-title"></h3>
        <p id="case-brief"></p>
      </section>

      <section id="suspects" class="suspect-grid" aria-label="Suspects"></section>

      <section class="interrogation">
        <h2 id="chat-title">Interrogation room</h2>
        <div id="chat-log" class="chat-log" aria-live="polite">
          <p class="placeholder">Select a suspect to begin.</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input
            id="question-input"
            type="text"
            placeholder="Type a question..."
            autocomplete="off"
            maxlength="300"
            disabled
          />
          <button id="ask-button" type="submit" disabled>Ask</button>
        </form>
      </section>

      <section id="result" class="result hidden" aria-live="polite"></section>
      <button id="restart" class="restart hidden" type="button">Play again</button>
    </main>

    <script src="app.js"></script>
  </body>
</html>
